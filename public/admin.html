
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор форм</title>

  <link rel="stylesheet" href="/styles.css">
  <script defer src="/alpine/cdn.min.js"></script>

  <style>[x-cloak] { display: none !important; }</style>
</head>

<body
  x-data="builder()"
  x-init="load()"
  class="min-h-screen bg-slate-50 text-slate-800"
>
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-5 py-5">
      <h1 class="text-2xl font-bold">Конструктор форм</h1>
      <p class="text-sm text-slate-500">
        Управление формами для стажировок и мероприятий
      </p>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-8 px-5 py-8">

    <!-- Уведомления -->
    <p
      x-cloak
      x-show="error"
      x-text="error"
      class="rounded-lg bg-red-50 p-4 text-red-700"
    ></p>

    <p
      x-cloak
      x-show="message"
      x-text="message"
      class="rounded-lg bg-green-50 p-4 text-green-700"
    ></p>

    <!-- Конструктор -->
    <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-5 text-xl font-semibold">Новая форма</h2>

      <form @submit.prevent="save()" class="space-y-5">
        <div>
          <label class="mb-2 block text-sm font-medium">
            Название формы
          </label>

          <input
            x-model="title"
            type="text"
            placeholder="Например, стажировка PHP Developer"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500"
          >
        </div>

        <div class="space-y-3">
          <h3 class="font-medium">Поля формы</h3>

          <p
            x-show="fields.length === 0"
            class="rounded-lg border border-dashed border-slate-300 p-5 text-center text-sm text-slate-500"
          >
            Полей пока нет. Добавьте первое поле.
          </p>

          <template x-for="(field, index) in fields" :key="field.id">
            <div class="rounded-lg border border-slate-200 bg-slate-50 p-4">
              <div class="grid gap-3 md:grid-cols-2">

                <input
                  x-model="field.name"
                  placeholder="Название поля"
                  class="rounded-lg border border-slate-300 bg-white px-3 py-2 outline-none focus:border-indigo-500"
                >

                <select
                  x-model="field.type"
                  class="rounded-lg border border-slate-300 bg-white px-3 py-2"
                >
                  <option value="text">Текст</option>
                  <option value="email">Email</option>
                  <option value="textarea">Большой текст</option>
                </select>
              </div>

              <div class="mt-3 flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm">
                  <input
                    type="checkbox"
                    x-model="field.required"
                    class="accent-indigo-600"
                  >
                  Обязательное поле
                </label>

                <button
                  type="button"
                  @click="fields.splice(index, 1)"
                  class="text-sm text-red-600 hover:text-red-800"
                >
                  Удалить
                </button>
              </div>
            </div>
          </template>
        </div>

        <div class="flex flex-wrap gap-3">
          <button
            type="button"
            @click="addField()"
            class="rounded-lg border border-slate-300 px-4 py-2 font-medium hover:bg-slate-50"
          >
            + Добавить поле
          </button>

          <button
            type="submit"
            :disabled="saving"
            class="rounded-lg bg-indigo-600 px-5 py-2 font-medium text-white hover:bg-indigo-700 disabled:opacity-50"
            x-text="saving ? 'Сохранение...' : 'Создать форму'"
          ></button>
        </div>
      </form>
    </section>

    <!-- Список форм -->
    <section>
      <div class="mb-5 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Созданные формы</h2>
        <span class="text-sm text-slate-500" x-text="forms.length + ' шт.'"></span>
      </div>

      <p x-show="loading" class="text-slate-500">Загрузка форм...</p>

      <p
        x-show="!loading && forms.length === 0"
        class="rounded-xl bg-white p-6 text-slate-500"
      >
        Созданных форм пока нет.
      </p>

      <div class="grid gap-4 md:grid-cols-2">
        <template x-for="form in forms" :key="form.id">
          <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">

            <div class="mb-4 flex items-start justify-between gap-3">
              <h3
                class="font-semibold"
                x-text="form.title"
              ></h3>

              <span
                class="rounded-full px-3 py-1 text-xs font-medium"
                :class="form.status === 'published'
                  ? 'bg-green-100 text-green-700'
                  : 'bg-amber-100 text-amber-700'"
                x-text="form.status === 'published'
                  ? 'Опубликована'
                  : 'Черновик'"
              ></span>
            </div>

            <!-- Статистика -->
            <div class="mb-5 grid grid-cols-3 gap-3 text-center">
              <div class="rounded-lg bg-slate-50 p-3">
                <p class="text-xl font-bold" x-text="form.views || 0"></p>
                <p class="text-xs text-slate-500">Просмотры</p>
              </div>

              <div class="rounded-lg bg-slate-50 p-3">
                <p class="text-xl font-bold" x-text="form.submissions || 0"></p>
                <p class="text-xs text-slate-500">Заявки</p>
              </div>

              <div class="rounded-lg bg-slate-50 p-3">
                <p
                  class="text-xl font-bold"
                  x-text="form.views
                    ? ((form.submissions || 0) / form.views * 100).toFixed(1) + '%'
                    : '—'"
                ></p>
                <p class="text-xs text-slate-500">Конверсия</p>
              </div>
            </div>

            <!-- Действия -->
            <div class="flex flex-wrap gap-2">
              <button
                x-show="form.status !== 'published'"
                @click="publish(form)"
                :disabled="publishingId === form.id"
                class="rounded-lg bg-indigo-600 px-4 py-2 text-sm text-white hover:bg-indigo-700 disabled:opacity-50"
              >
                Опубликовать
              </button>

              <a
                x-show="form.status === 'published'"
                :href="'/f/' + form.id"
                target="_blank"
                rel="noopener noreferrer"
                class="rounded-lg bg-green-600 px-4 py-2 text-sm text-white hover:bg-green-700"
              >
                Открыть форму
              </a>

              <button
                @click="showResponses(form)"
                class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-50"
              >
                Ответы
              </button>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- Ответы студентов -->
    <section
      x-cloak
      x-show="selectedForm"
      class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm"
    >
      <div class="mb-5 flex items-center justify-between">
        <h2 class="text-xl font-semibold">
          Ответы: <span x-text="selectedForm?.title"></span>
        </h2>

        <button
          @click="selectedForm = null"
          class="text-slate-500 hover:text-slate-900"
        >
          Закрыть
        </button>
      </div>

      <p x-show="loadingResponses">Загрузка ответов...</p>

      <p
        x-show="!loadingResponses && responses.length === 0"
        class="text-slate-500"
      >
        Ответов пока нет
      </p>

      <div class="space-y-4">
        <template x-for="response in responses" :key="response.id">
          <div class="rounded-lg border border-slate-200 p-4">
            <p
              class="mb-3 text-xs text-slate-500"
              x-text="new Date(response.createdAt).toLocaleString('ru-RU')"
            ></p>

            <template
              x-for="entry in Object.entries(response.answers || {})"
              :key="entry[0]"
            >
              <p class="mb-2 text-sm">
                <strong x-text="entry[0]"></strong>:
                <span x-text="entry[1]"></span>
              </p>
            </template>
          </div>
        </template>
      </div>
    </section>

  </main>

  <script>
    function builder() {
      return {
        title: '',
        fields: [],
        forms: [],
        responses: [],
        selectedForm: null,
        loading: false,
        loadingResponses: false,
        saving: false,
        publishingId: null,
        error: '',
        message: '',

        addField() {
          this.fields.push({
            id: crypto.randomUUID(),
            name: '',
            type: 'text',
            required: false
          });
        },

        async load() {
          this.loading = true;

          try {
            const res = await fetch('/api/forms');
            if (!res.ok) throw new Error('Ошибка загрузки форм');

            this.forms = await res.json();
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },

        async save() {
          this.error = '';
          this.message = '';

          if (!this.title.trim()) {
            return alert('Укажи название формы');
          }

          if (!this.fields.length || this.fields.some(f => !f.name.trim())) {
            return alert('Добавь и заполни поля');
          }

          const names = this.fields.map(f => f.name.trim());
          if (new Set(names).size !== names.length) {
            return alert('Названия полей должны быть уникальными');
          }

          const fields = this.fields.map(({name, type, required}) => ({
            name: name.trim(),
            type,
            required
          }));

          this.saving = true;

          try {
            const res = await fetch('/api/forms', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                title: this.title.trim(),
                fields
              })
            });

            if (!res.ok) throw new Error('Ошибка создания формы');

            this.title = '';
            this.fields = [];
            this.message = 'Форма создана';

            await this.load();
          } catch (e) {
            this.error = e.message;
          } finally {
            this.saving = false;
          }
        },

        async publish(form) {
          this.error = '';
          this.publishingId = form.id;

          try {
            const res = await fetch(`/api/forms/${form.id}/publish`, {
              method: 'POST'
            });

            if (!res.ok) throw new Error('Ошибка публикации');

            this.message = 'Форма опубликована';
            await this.load();
          } catch (e) {
            this.error = e.message;
          } finally {
            this.publishingId = null;
          }
        },

        async showResponses(form) {
          this.selectedForm = form;
          this.responses = [];
          this.loadingResponses = true;
          this.error = '';

          try {
            const res = await fetch(`/api/forms/${form.id}/responses`);

            if (!res.ok) throw new Error('Ошибка загрузки ответов');

            this.responses = await res.json();
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loadingResponses = false;
          }
        }
      };
    }
  </script>
</body>
</html>


<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма отклика</title>

  <link rel="stylesheet" href="/styles.css">
  <script defer src="/alpine/cdn.min.js"></script>

  <style>[x-cloak] { display: none !important; }</style>
</head>

<body
  x-data="studentForm()"
  x-init="load()"
  class="min-h-screen bg-slate-50 text-slate-800"
>
  <main class="mx-auto max-w-2xl px-4 py-12">

    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">

      <!-- Загрузка -->
      <p x-show="loading" class="text-slate-500">
        Загрузка формы...
      </p>

      <!-- Ошибки -->
      <p
        x-show="error"
        x-text="error"
        class="mb-4 rounded-lg bg-red-50 p-4 text-red-600"
      ></p>

      <!-- Успешная отправка -->
      <div x-cloak x-show="success" class="py-10 text-center">
        <h2 class="text-2xl font-bold text-green-600">
          Заявка отправлена!
        </h2>

        <p class="mt-3 text-slate-500">
          Спасибо за отклик.
        </p>
      </div>

      <!-- Форма -->
      <form
        x-cloak
        x-show="form && !success"
        @submit.prevent="submit()"
        class="space-y-6"
      >
        <div>
          <h1
            x-text="form?.title"
            class="text-2xl font-bold"
          ></h1>

          <p class="mt-2 text-sm text-slate-500">
            Заполните поля для отправки заявки
          </p>
        </div>

        <template x-for="field in (form?.fields || [])" :key="field.name">
          <div>
            <label class="mb-2 block text-sm font-medium">
              <span x-text="field.name"></span>
              <span
                x-show="field.required"
                class="text-red-500"
              >*</span>
            </label>

            <template x-if="field.type === 'textarea'">
              <textarea
                x-model="answers[field.name]"
                :required="field.required"
                rows="4"
                class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500"
              ></textarea>
            </template>

            <template x-if="field.type !== 'textarea'">
              <input
                :type="field.type"
                x-model="answers[field.name]"
                :required="field.required"
                class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500"
              >
            </template>
          </div>
        </template>

        <button
          type="submit"
          :disabled="sending"
          class="w-full rounded-lg bg-indigo-600 py-3 font-medium text-white hover:bg-indigo-700 disabled:opacity-50"
          x-text="sending ? 'Отправка...' : 'Отправить заявку'"
        ></button>
      </form>

    </div>
  </main>

  <script>
    function studentForm() {
      return {
        form: null,
        answers: {},
        loading: true,
        sending: false,
        success: false,
        error: '',

        async load() {
          const id = location.pathname.split('/').pop();

          try {
            const res = await fetch(`/api/forms/${id}`);

            if (!res.ok) {
              throw new Error('Форма не найдена или не опубликована');
            }

            this.form = await res.json();

            // Учитываем просмотр формы
            await fetch(`/api/forms/${id}/view`, {
              method: 'POST'
            });

          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },

        async submit() {
          this.sending = true;
          this.error = '';

          try {
            const res = await fetch(
              `/api/forms/${this.form.id}/submit`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  answers: this.answers
                })
              }
            );

            if (!res.ok) {
              const data = await res.json();
              throw new Error(data.error || 'Ошибка отправки');
            }

            this.success = true;

          } catch (e) {
            this.error = e.message;
          } finally {
            this.sending = false;
          }
        }
      };
    }
  </script>
</body>
</html>
